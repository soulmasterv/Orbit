name: Orbit

options:
  bundleIdPrefix: com.orbit
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  Orbit:
    type: application
    platform: iOS

    sources:
      - Orbit

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servercontrol.app
        PRODUCT_NAME: Orbit
        MARKETING_VERSION: 4.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

    info:
      path: Orbit/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Unlock Orbit and authorize sensitive server commands with Face ID.
        NSMicrophoneUsageDescription: Talk to JARVIS after tapping Start voice. Audio is streamed through your homelab for an internet voice conversation.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  OrbitTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Orbit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servercontrol.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  Orbit:
    build:
      targets:
        Orbit: all
    test:
      config: Debug
      targets:
        - OrbitTests




