name: ServerControl

options:
  bundleIdPrefix: com.servercontrol
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  ServerControl:
    type: application
    platform: iOS

    sources:
      - ServerControl

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servercontrol.app
        PRODUCT_NAME: ServerControl
        MARKETING_VERSION: 4.0.0
        CURRENT_PROJECT_VERSION: 1
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""

    info:
      path: ServerControl/Info.plist
      properties:
        CFBundleDisplayName: Orbit
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSFaceIDUsageDescription: Unlock Orbit and authorize sensitive server commands with Face ID.
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false

  ServerControlTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: ServerControl
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.servercontrol.app.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  ServerControl:
    build:
      targets:
        ServerControl: all
    test:
      config: Debug
      targets:
        - ServerControlTests

