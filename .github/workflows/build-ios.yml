name: Build ServerControl IPA

on:
  workflow_dispatch:
    inputs:
      capture_previews:
        description: Capture optional simulator screenshots
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test backend adapter safety
        run: python3 -m unittest discover -s backend -p 'test_*.py'
      - name: Test JARVIS frontend lifecycle
        run: node --test backend/jarvis/frontend.test.cjs
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build ServerControl for iPhone
        run: |
          set -euo pipefail
          xcodebuild -project ServerControl.xcodeproj -scheme ServerControl -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Select iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for devices in d["devices"].values() for v in devices if v["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$DEVICE" >> "$GITHUB_ENV"
      - name: Test API compatibility and command safety
        run: |
          xcodebuild test -project ServerControl.xcodeproj -scheme ServerControl -configuration Debug -sdk iphonesimulator -destination "platform=iOS Simulator,id=$SIMULATOR_ID" -derivedDataPath build-test -resultBundlePath TestResults.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package and validate IPA
        run: |
          set -euo pipefail
          APP=build/Build/Products/Release-iphoneos/ServerControl.app
          test -f "$APP/ServerControl"
          plutil -lint "$APP/Info.plist"
          lipo "$APP/ServerControl" -verify_arch arm64
          python3 tools/validate_bundle.py "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ServerControl.ipa Payload
          unzip -t ServerControl.ipa
          shasum -a 256 ServerControl.ipa > ServerControl.ipa.sha256
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ServerControl-IPA
          path: |
            ServerControl.ipa
            ServerControl.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Export simulator layout previews
        if: success()
        timeout-minutes: 8
        run: |
          set -euo pipefail
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots
      - name: Upload simulator previews
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ServerControl-Previews
          path: screenshots/
          if-no-files-found: error
          retention-days: 30
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ServerControl-TestResults
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7

